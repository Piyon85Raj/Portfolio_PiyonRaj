<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=build/index.html">
  <link rel="icon" href="build/favicon.png" />
  <title>Piyon Raj | Game Developer Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 50%, #1c1538 0%, #0d0a1a 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(199, 112, 240, 0.3);
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(199, 112, 240, 0.15);
      backdrop-filter: blur(10px);
    }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 24px;
      border: 4px solid rgba(199, 112, 240, 0.2);
      border-top-color: #cd5ff8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #a588c0;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    a.btn {
      display: inline-block;
      background: #623686;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(98, 54, 134, 0.4);
    }
    a.btn:hover {
      background: #7d44ab;
      box-shadow: 0 6px 20px rgba(125, 68, 171, 0.6);
      transform: translateY(-2px);
    }
  </style>
  <script>
    // Preserve hash routing (e.g., #/project, #/about) when redirecting
    const target = "build/index.html" + window.location.hash;
    window.location.replace(target);
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Piyon Raj Portfolio</h1>
    <p>Opening the interactive React portfolio in your browser...</p>
    <a class="btn" href="build/index.html">Open Portfolio Directly</a>
  </div>
</body>
</html>
